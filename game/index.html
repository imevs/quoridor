<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Quoridors — 3D Board Game</title>
    <meta
      name="description"
      content="3D implementation of the Quoridor board game built with Three.js and TypeScript."
    />
    <meta name="theme-color" content="#cfe3c2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        if (window.matchMedia('(max-height: 550px) and (orientation: landscape) and (min-aspect-ratio: 5/4)').matches) {
          document.documentElement.setAttribute('data-mobile-landscape', '');
        }
      } catch (_) {}
    </script>
  </head>
  <body>
    <main id="stage" aria-label="3D game board"></main>
    <div id="hud-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
